# Voice server on Fly.io. Deploy with scripts/deployVoice.sh (see README "Hosting the voice server").
app = "hold-voice"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # This machine owns Fogline's Twilio number: it points the number at itself on boot.
  TWILIO_POINT_WEBHOOK = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Phone calls can't wait for a cold start, and live calls must not be stopped mid-sentence.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
