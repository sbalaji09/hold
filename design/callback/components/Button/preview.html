<!-- @dsCard group="Keys" height=150 subtitle="Locked actions say why, and who can act" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="cb-stack"></div>
<script>
  var C = window.Callback, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap', alignItems: 'center' } },
      h(C.Button, { variant: 'primary' }, 'Pay $4,250.00'),
      h(C.Button, { variant: 'secondary', icon: 'phone' }, 'Call supplier'),
      h(C.Button, { variant: 'hold', icon: 'hold' }, 'Hold'),
      h(C.Button, { variant: 'ask' }, 'Why?')),
    h('div', { style: { display: 'flex', gap: '24px', flexWrap: 'wrap', alignItems: 'flex-start' } },
      h(C.Button, { variant: 'primary', locked: 'Callback can\u2019t release a held payment. Dev has to approve it.' }, 'Release payment'),
      h(C.Button, { variant: 'secondary', locked: 'Needs a passed call and Dev\u2019s approval. The 10:42 AM call failed.' }, 'Change bank details'))));
</script>
</body>
</html>
