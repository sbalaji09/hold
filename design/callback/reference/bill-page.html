<!-- @dsCard group="Screens" height=640 width=1040 page subtitle="The demo's money shot: a bill page the moment the call fails" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bill page — preview</title>
<style>
  .bp { display: grid; grid-template-columns: 1fr var(--evidence-width); gap: var(--space-5); padding: var(--space-5) var(--space-6); width: 1040px; box-sizing: border-box; }
  .bp-top { grid-column: 1 / span 2; display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4); }
  .bp-crumb { font: 600 10.5px/14px var(--font-sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
  .bp-keys { display: flex; gap: 10px; align-items: flex-start; }
  .bp-doc { position: relative; padding: var(--space-5); }
  .bp-meta { display: grid; grid-template-columns: 64px 1fr; row-gap: 2px; font: 400 12px/18px var(--font-mono); color: var(--ink-muted); padding-bottom: var(--space-3); border-bottom: 1px dashed var(--line); }
  .bp-meta b { color: var(--ink); font-weight: 400; }
  .bp-body { font: 400 14px/22px var(--font-sans); padding: var(--space-4) 0; max-width: 46ch; }
  .bp-pay { display: flex; flex-direction: column; gap: 10px; padding-top: var(--space-4); border-top: 1px dashed var(--line); }
  .bp-stamp { position: absolute; right: var(--space-5); bottom: var(--space-5); }
  .bp-side { display: flex; flex-direction: column; gap: var(--space-4); }
  .bp-sign { padding: var(--space-4); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var C = window.Callback, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'bp' },
      h('div', { className: 'bp-top' },
        h('div', null,
          h('div', { className: 'bp-crumb' }, 'Inbox / Stagecraft Rigging Co. / INV-4502'),
          h('h1', { className: 'cb-subject' }, 'Updated remittance details')),
        h('div', { className: 'bp-keys' },
          h(C.Button, { variant: 'ask' }, 'Why?'),
          h(C.Button, { variant: 'secondary', icon: 'phone' }, 'Call again'),
          h(C.Button, { variant: 'primary', locked: 'Held after a failed call. Dev has to sign.' }, 'Pay $18,400.00'))),
      h('div', { className: 'cb-doc bp-doc' },
        h('div', { className: 'bp-meta' },
          h('span', null, 'From'), h('b', null, 'accounts@stagecraftrigging.com'),
          h('span', null, 'To'), h('b', null, 'bills@fogline.fm'),
          h('span', null, 'Received'), h('b', null, 'Oct 21, 9:58 AM')),
        h('div', { className: 'bp-body' },
          h('p', { style: { margin: '0 0 10px' } }, 'Hi Fogline team,'),
          h('p', { style: { margin: '0 0 10px' } }, 'Please note we have moved banks. Use the details below for INV-4502 (main stage truss, final). This needs to go out today or the build slips.'),
          h('p', { style: { margin: 0 } }, 'Kind regards, Accounts Team')),
        h('div', { className: 'bp-pay' },
          h(C.Amount, { cents: 1840000, size: 'lg' }),
          h(C.AccountLine, { bank: 'Mercury', routing: '084106768', last4: '8817', state: 'new' })),
        h('div', { className: 'bp-stamp' }, h(C.Endorsement, { kind: 'held', meta: 'Oct 21 · 10:43 AM · Callback' }))),
      h('div', { className: 'bp-side' },
        h('div', { className: 'cb-doc' },
          h('div', { className: 'cb-doc-head' }, 'Callback’s checks', h('small', null, '2 failed')),
          h('div', { role: 'list' },
            h(C.CheckRow, { n: 1, result: 'fail', title: 'Bank account never used before', evidence: '11 payments since April, all to Chase ··2210.', sources: ['11 payments'] }),
            h(C.CheckRow, { n: 2, result: 'fail', title: 'Doesn’t write like Stagecraft', quote: 'Kind regards, Accounts Team', flag: 'Accounts Team', sources: ['14 emails'] }),
            h(C.CheckRow, { n: 3, result: 'pass', title: 'Sent from the real domain' }))),
        h(C.Line, { state: 'not-confirmed', supplier: 'Rosa Quintero · Stagecraft', number: '(415) 555-0142', elapsed: '01:31', note: '“We never changed our bank.”' }),
        h('div', { className: 'cb-doc bp-sign' }, h(C.SignOff, { state: 'awaiting', name: 'Dev Okafor', role: 'Controller', time: 'Sent 10:43 AM' })))));
</script>
</body>
</html>
